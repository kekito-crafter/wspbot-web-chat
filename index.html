<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wspbot — chat web</title><style>body{margin:0;background:#0b141a;color:#e9edef;font:16px system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh}.app{width:min(720px,100vw);height:min(820px,100vh);background:#111b21;display:flex;flex-direction:column}.top{padding:17px 20px;background:#202c33;display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#00a884;font-size:24px}.title b{display:block}.title small{color:#aebac1}.messages{flex:1;padding:22px;overflow:auto;background:#0b141a;background-image:radial-gradient(#1c2c33 1px,transparent 1px);background-size:22px 22px}.bubble{max-width:78%;padding:11px 13px;border-radius:9px;margin:10px 0;background:#202c33;line-height:1.35}.bot{margin-left:auto;background:#005c4b}.hint{text-align:center;color:#8696a0;font-size:13px;margin:10px}.send{display:flex;gap:8px;padding:12px;background:#202c33}.send input{flex:1;border:0;border-radius:22px;padding:13px 16px;font-size:16px;outline:none;background:#2a3942;color:#e9edef}.send button{border:0;border-radius:50%;width:47px;background:#00a884;color:#fff;font-size:20px;cursor:pointer}.note{color:#aebac1;font-size:12px;padding:0 20px 14px;text-align:center}</style></head><body><main class="app"><div class="top"><div class="avatar">🤖</div><div class="title"><b>wspbot</b><small>en línea en WhatsApp</small></div></div><section class="messages" id="msgs"><div class="hint">Hoy</div><div class="bubble bot">¡Hola! Soy wspbot. Por ahora conversamos en el grupo de WhatsApp: etiquétame y te respondo.</div></section><form class="send" id="form"><input id="text" autocomplete="off" placeholder="Escribe un mensaje…"><button aria-label="Enviar">➤</button></form><div class="note">Demo web — para hablar conmigo de verdad, etiquétame en el grupo de WhatsApp.</div></main><script>const f=document.querySelector('#form'),t=document.querySelector('#text'),m=document.querySelector('#msgs');f.addEventListener('submit',e=>{e.preventDefault();if(!t.value.trim())return;let x=document.createElement('div');x.className='bubble bot';x.textContent='Recibí: “'+t.value+'”. Aún no tengo chat web conectado; escríbeme etiquetándome en WhatsApp.';m.append(x);t.value='';m.scrollTop=m.scrollHeight})</script></body></html>
