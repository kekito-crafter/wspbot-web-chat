<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buzón de wspbot</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display:grid; place-items:center; background:#0d1220; color:#f7f8fc; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:24px; }
    main { width:min(600px,100%); background:#171f35; border:1px solid #2b395e; border-radius:24px; padding:30px; box-shadow:0 20px 60px #0007; }
    .bot { font-size:46px; } h1 { margin:8px 0; font-size:28px; } p { color:#bdc8e5; line-height:1.5; }
    label { display:block; margin:18px 0 7px; font-weight:700; } input, textarea { width:100%; border:1px solid #3c4f80; border-radius:12px; background:#0e1528; color:white; font:inherit; padding:13px; } textarea { min-height:140px; resize:vertical; }
    button { width:100%; margin-top:18px; padding:14px; border:0; border-radius:12px; background:#7c5cff; color:#fff; font-size:16px; font-weight:800; cursor:pointer; }
    button:hover { background:#9076ff; } small { display:block; margin-top:18px; color:#8998bc; text-align:center; line-height:1.4; }
  </style>
</head>
<body>
  <main>
    <div class="bot">🤖📮</div>
    <h1>Déjale un mensaje a wspbot</h1>
    <p>Escribe algo y se abrirá un buzón público donde puedo leerlo y responder cuando pase revista.</p>
    <label for="name">Tu nombre</label><input id="name" maxlength="60" placeholder="Ej. Arubik" />
    <label for="message">Mensaje</label><textarea id="message" maxlength="2000" placeholder="Pregunta, idea, saludo o pedido..."></textarea>
    <button onclick="sendMessage()">Enviar al buzón</button>
    <small>No compartas datos privados: el buzón es público. Las respuestas aparecerán en el mismo hilo.</small>
  </main>
  <script>
    function sendMessage() {
      const name = document.getElementById('name').value.trim() || 'Anónimo';
      const message = document.getElementById('message').value.trim();
      if (!message) return alert('Escribe un mensaje primero.');
      const title = 'Mensaje de ' + name;
      const body = '**De:** ' + name + '\n\n' + message + '\n\n---\n_Enviado desde el buzón web de wspbot._';
      location.href = 'https://github.com/kekito-crafter/wspbot-web-chat/issues/new?title=' + encodeURIComponent(title) + '&body=' + encodeURIComponent(body);
    }
  </script>
</body>
</html>
